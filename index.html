<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Products</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <!-- Search -->
        <div class="search">

            <input
                type="text"
                id="searchInput"
                placeholder="Search products"
            >

            <button id="searchButton">
                Search
            </button>

            <button id="cartButton">
                Cart (<span id="cartCount">0</span>)
            </button>

        </div>


        <!-- Product List -->
        <div class="cart"></div>


        <!-- Product Details -->
        <div id="productDetails"></div>


        <!-- Cart Section -->
        <div id="cartSection">

            <h2 id="cartTitle">Shopping Cart</h2>

            <!-- Added products -->
            <div id="cartItems"></div>


            <!-- Summary Table -->
            <div id="summarySection">

                <h3>Order Summary</h3>

                <table id="summaryTable">

                    <thead>

                        <tr>
                            <th>Product</th>
                            <th>Price</th>
                            <th>Quantity</th>
                            <th>Total</th>
                        </tr>

                    </thead>

                    <tbody id="summaryBody">
                    </tbody>

                    <tfoot>

                        <tr>
                            <th colspan="3">Grand Total</th>
                            <th>$<span id="summaryTotal">0.00</span></th>
                        </tr>

                    </tfoot>

                </table>

            </div>


            <!-- Cart Buttons -->
            <div class="cart-buttons">

                <button id="continueShoppingButton">
                    Continue Shopping
                </button>

                <button id="buyButton">
                    Buy Now
                </button>

            </div>

        </div>


        <!-- Pagination -->
        <div class="footer">

            <button class="arrow-button left-button">
                <i class="arrow left"></i>
            </button>

            <div class="page-numbers"></div>

            <button class="arrow-button right-button">
                <i class="arrow right"></i>
            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
