<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Top Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">

            <button id="homeButton">Home</button>

            <div class="nav-search">
                <input type="text" id="searchInput" placeholder="Search products">
                <button id="searchButton">Search</button>
            </div>

            <button id="cartButton">Cart (<span id="cartCount">0</span>)</button>

        </div>
    </nav>

    <div class="container">
        <div class="cart"></div>
        <div id="productDetails"></div>
        <div id="cartSection">
            <h2 id="cartTitle">Shopping Cart</h2>
            <div id="cartItems"></div>
            <div id="summarySection">
                <h3>Order Summary</h3>
                <div class="table-scroll">
                    <table id="summaryTable">
                        <thead>
                            <tr>
                                <th>Product</th>
                                <th>Price</th>
                                <th>Quantity</th>
                                <th>Total</th>
                            </tr>
                        </thead>
                        <tbody id="summaryBody">
                        </tbody>
                        <tfoot>
                            <tr>
                                <th colspan="3">Grand Total</th>
                                <th>$<span id="summaryTotal">0.00</span></th>
                            </tr>
                        </tfoot>
                    </table>
                </div>
            </div>

            <!-- Cart Buttons -->
            <div class="cart-buttons">
                <button id="continueShoppingButton">
                    Continue Shopping
                </button>
                <button id="buyButton">
                    Buy Now
                </button>
            </div>

        </div>

    </div>

    <!-- Fixed Bottom Pagination -->
    <div class="footer">
        <button class="arrow-button left-button">
            <i class="arrow left"></i>
        </button>
        <div class="page-numbers"></div>
        <button class="arrow-button right-button">
            <i class="arrow right"></i>
        </button>
    </div>

    <script src="script.js"></script>
</body>
</html>
